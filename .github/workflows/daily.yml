name: Daily prediction

on:
  schedule:
    # 04:00 and 16:00 UTC = 09:30 and 21:30 IST (UTC+5:30) — morning + evening.
    # The backup run keeps the streak alive if the first one fails.
    # GitHub's cron can be delayed 15 min–2 h under load — that's normal, and
    # grading is date-based so a late run still settles the right bets.
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  # Lets you trigger a run manually from the Actions tab.
  workflow_dispatch:

# Allow the workflow to push commits and open an issue on failure.
permissions:
  contents: write
  issues: write

# Never let two runs push at once.
concurrency:
  group: daily-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # verify.py reads commit timestamps to prove each prediction predates
          # its outcome; the default shallow clone has no history to read, and
          # the check would silently skip itself rather than fail.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Observe, predict, grade
        env:
          # Move the forecast bet to your own city by setting repo variables
          # (Settings -> Secrets and variables -> Actions -> Variables).
          CITY_NAME: ${{ vars.CITY_NAME }}
          CITY_LAT: ${{ vars.CITY_LAT }}
          CITY_LON: ${{ vars.CITY_LON }}
          CITY_TZ: ${{ vars.CITY_TZ }}
        run: python predict.py

      # Committing before the audit is deliberate. The chronology check reads
      # each archive day's commit timestamp, so today's file has to be in git
      # for it to be checked at all — and committing is local, so nothing is
      # published yet if the audit then fails.
      - name: Commit locally
        id: commit
        env:
          AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'Oumar Tamba Tirera' }}
          AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'oumartambatirera@gmail.com' }}
        run: |
          # Commit AS YOU so it counts toward your contribution graph — and so
          # the timestamp on the prediction is a real, checkable receipt.
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Predictions and grading: $(date -u +'%Y-%m-%d')"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate. A record that does not audit never reaches the public repo.
      - name: Audit before publishing
        run: python verify.py

      # A push that lands while this run is in flight — a source commit, or the
      # other daily run — leaves this branch behind and the push is rejected.
      # That cost a whole day's entry once. Rebase and retry instead.
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — remote moved. Rebasing (attempt $attempt)."
            if ! git pull --rebase origin main; then
              echo "Rebase conflicted. This needs a human; nothing was pushed."
              git rebase --abort || true
              exit 1
            fi
            # The rebase may have brought in an archived day from the other
            # run, so the derived files have to be rebuilt and re-audited
            # before this is allowed anywhere near the remote again.
            python rebuild_derived.py
            git add -A
            git diff --cached --quiet || git commit -m "Rebuild derived files after rebase"
            if ! python verify.py; then
              echo "Audit failed after rebase; withholding the push."
              exit 1
            fi
          done
          echo "Still rejected after 3 attempts."
          exit 1

      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily prediction failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `The scheduled **Daily prediction** run failed.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Trigger: \`${context.eventName}\``,
              ``,
              `A single failed run does not break the streak on its own — the backup run may still succeed.`,
              `Bets that never get settled are counted as **void** in the ledger, not as wins.`,
              ``,
              `If the **Audit before publishing** step is the one that failed, nothing was pushed:`,
              `the record did not reconcile, so it was withheld rather than published. Run`,
              `\`python verify.py\` locally for the specific mismatch.`,
            ].join("\n");
            // Avoid duplicate open issues for the same failure.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "prediction-failure",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["prediction-failure"],
              });
            }
